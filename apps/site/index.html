<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2ef" />
    <meta name="description" content="The official type-safe, tree-shakeable interface icon library for Uplus." />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Uplus Icon" />
    <meta property="og:title" content="Uplus Icon — A quiet icon library" />
    <meta property="og:description" content="The official type-safe, tree-shakeable interface icon library for Uplus." />
    <meta property="og:url" content="https://icon.upper.website/" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://icon.upper.website/" />
    <style>
      html, body { background: #fff; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #11110f; }
    </style>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('uplus-theme')
        const themePreference = savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'system'
          ? savedTheme
          : 'system'
        const theme = themePreference === 'system'
          ? matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          : themePreference
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#11110f' : '#f2f2ef')
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Uplus Icon — A quiet icon library</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
