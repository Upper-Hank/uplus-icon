name: Bug report
description: Report a reproducible problem in the package or website.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [React package, Documentation website, Build tooling]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example or exact steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Package version, React version, browser, and operating system when relevant.
